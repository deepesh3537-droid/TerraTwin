services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terratwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: terratwin
      # LOCAL DEVELOPMENT VALUE ONLY. Never use this password in production.
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: terratwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terratwin -d terratwin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: terratwin_pgdata
